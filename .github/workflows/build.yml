name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleGmsDebug --warning-mode summary
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BD-Music-APK
          path: app/build/outputs/apk/**/*.apk
