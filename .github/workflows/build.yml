name: Build APKs
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cp ~/.android/debug.keystore app/debug.keystore || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleIzzyDebug --stacktrace

      - name: Find APK
        run: find app/build -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BD-Music-APK
          path: app/build/outputs/apk/**/*.apk
